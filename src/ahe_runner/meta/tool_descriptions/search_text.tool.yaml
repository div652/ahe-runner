type: tool
name: search_text
description: Search text files of any size inside an exposed virtual root, returning bounded matches and explicit skipped/truncation metadata. Each match is a short snippet around the hit with its line and column; one call returns at most about 32,000 characters of matches. When truncated is true, narrow relative_path, file_glob, or query, or read the reported line with read_file.
input_schema:
  type: object
  properties:
    root:
      type: string
    query:
      type: string
    relative_path:
      type: string
      default: "."
    file_glob:
      type: string
      default: "**/*"
    case_sensitive:
      type: boolean
      default: false
    regex:
      type: boolean
      default: false
  required: [root, query]
  additionalProperties: false
