type: tool
name: delete_path
description: >-
  Delete one file, or one directory that is already empty, inside your
  writable root. `.git` paths cannot be deleted.
input_schema:
  type: object
  properties:
    file_path:
      type: string
      description: >-
        Absolute path of the file or empty directory to delete. A relative
        path is resolved against your writable root.
  required: [file_path]
  additionalProperties: false
