type: tool
name: write
description: Write a plain markdown file (typically `response.md`) to the output
  directory. For binary deliverables (.docx, .xlsx, .pptx), use the file-type skill
  manuals — do not write raw markdown to a binary extension. Creates parent directories
  if needed.
input_schema:
  type: object
  properties:
    file_path:
      type: string
      description: Relative path under the output directory (e.g., 'response.md')
    content:
      type: string
      description: Markdown content to write
  required:
  - file_path
  - content
disable_parallel: true
binding: tools.write:write
