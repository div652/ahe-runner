type: tool
name: edit
description: >-
  Perform exact string replacement in a file you have already created or read.
  The old_string must appear exactly once unless replace_all is true. Use for
  incremental refinement, not first-time writes.
input_schema:
  type: object
  additionalProperties: false
  properties:
    file_path:
      type: string
      description: Path to the file to modify
    old_string:
      type: string
      description: The exact text to find and replace
    new_string:
      type: string
      description: The replacement text
    replace_all:
      type: boolean
      description: If true, replace all occurrences. Default false.
      default: false
  required:
    - file_path
    - old_string
    - new_string
disable_parallel: true
binding: tools.edit:edit
