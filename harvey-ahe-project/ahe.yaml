# AHE campaign configuration for evolving a NexAU harness on Harvey LAB.
#
# Operator-owned values (fill before any command; see HARVEY_AHE_RUNBOOK.md):
#   * every `replace-with-exact-...` model ID: use the exact IDs advertised by
#     the endpoint's /v1/models catalog, without `copilot/` or `openai/` prefixes;
#   * the live budget: campaign.rounds, evaluation.*_trials, and concurrency.
# Model IDs and budget below were chosen by the operator on 2026-10-13; the
# record is in HARVEY_AHE_RUNBOOK.md section 3a. The first campaign
# (harvey-lab-first-campaign) stopped at round 2 on AHE-010. The second
# (harvey-lab-campaign-2-search-cap) was stopped early in round 1 to switch to
# LAB's default grading parallelism. The third campaign
# (harvey-lab-campaign-3-grading-parallel) carried both changes. This fourth
# campaign raises grading_parallel from 6 to 50 (runbook sections 5a-5d).
schema_version: 1

campaign:
  name: harvey-lab-campaign-4-grading-parallel-50
  artifacts_dir: ./campaign-artifacts/harvey-lab-campaign-4-grading-parallel-50
  rounds: 3
  root_seed: 42

project:
  harness_dir: ./harness
  harness_manifest: ./harness_manifest.yaml
  adapter: benchmark_adapter:HarveyAdapter
  adapter_settings:
    # Relative paths resolve against this file's directory.
    lab_root: ../../harvey-labs
    split_file: ./splits.json
    # LAB's standard judge pair is claude-sonnet-4-6 and gpt-5.5. The results
    # carry the `lab-standard-dual-v1` profile label only when the configured IDs
    # equal those strings; any other IDs are labelled `custom-dual`.
    # claude-sonnet-4-6 is not advertised by the loopback endpoint (catalog of
    # 2026-10-13), so judge 1 and the helper use claude-sonnet-5 and results are
    # labelled `custom-dual`. Reasoning is provider default for judges/helper.
    judges:
      - model: claude-sonnet-5
        max_tokens: 64000
        temperature: 0.0
      - model: gpt-5.5
        max_tokens: 64000
        temperature: 0.0
    # LAB's deliverable filename helper (claude-sonnet-4-6, 1024 tokens, T=0).
    helper:
      model: claude-sonnet-5
      max_tokens: 1024
      temperature: 0.0
    judge_max_prompt_chars: 240000
    # Must already exist locally (pull or build; the runbook shows both).
    sandbox_image: lab-sandbox:latest
    shell_timeout: 60
    # null uses the system temporary directory for per-trial scratch copies.
    scratch_root: null
    # Rubric criteria graded concurrently per judge (adapter limit 100). LAB's
    # own default is 6 (lab_core/evaluation/run_eval.py --parallel). Tasks have
    # 33-40 criteria, so 50 grades each judge's whole rubric at once. Verdicts
    # stay in rubric order.
    grading_parallel: 50
    grading_attempts: 2
  adapter_dependency_paths:
    - ./benchmark_adapter.py
    - ./harvey_ahe
    - ./splits.json
    - ./pyproject.toml
    - ./requirements.txt
  meta_agent_source_roots:
    - ./benchmark_public

models:
  evaluated:
    model: gpt-5.4-mini
    max_tokens: 64000
    reasoning_effort: provider-default
    temperature: 0.0
  meta:
    model: gpt-5.4
    max_tokens: 32000
    reasoning_effort: high
    temperature: 0.2

transport:
  base_url: http://127.0.0.1:3141/v1
  api_key_env: null
  api_mode: chat_completions
  stream: false
  request_timeout_seconds: 600
  observable_model_policy: exact
  model_catalog: required
  negative_control: required

evaluation:
  train_trials: 1
  validation_trials: 1
  test_trials: 1
  max_concurrency: 20

debugger:
  max_concurrency: 20
  max_iterations: 80

recovery:
  maximum_stage_attempts: 3
  archive_incomplete_attempts: true

meta:
  backend: nexau
  explore:
    source_enabled: true
    web_enabled: true
    web_search_backend: ddgs
    research_seed_urls:
      - https://github.com/nex-agi/NexAU
      - https://python-docx.readthedocs.io/en/latest/
      - https://openpyxl.readthedocs.io/en/stable/
      - https://python-pptx.readthedocs.io/en/latest/
  role_supplements:
    source: ./meta_supplements/source.md
    web: ./meta_supplements/web.md
    debugger: ./meta_supplements/debugger.md
    evolve: ./meta_supplements/evolve.md
  max_concurrent_model_calls: 6
  max_context_tokens: 200000
  max_running_subagents: 5
  evolve_max_iterations: 500
  explore_max_iterations: 200
