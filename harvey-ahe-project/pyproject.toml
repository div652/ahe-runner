[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "harvey-ahe-adapter"
version = "0.1.0"
description = "Protected Harvey LAB operator integration for AHE Runner"
requires-python = ">=3.12"
# AHE Runner is the host environment (installed from this repository) and is
# not restated here: its NexAU git-URL dependency cannot be resolved
# transitively by uv. The adapter records installed versions at run time.
dependencies = ["lab-core==1.2.0"]

[tool.hatch.build.targets.wheel]
packages = ["harvey_ahe"]
