[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "ahe-runner"
version = "0.1.0"
description = "Checkpointed Agentic Harness Engineering for NexAU harnesses"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "nexau==0.3.9",
  "openai>=1.60",
  "pydantic>=2.8",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
web = [
  "beautifulsoup4>=4.12",
  "ddgs>=9.0",
  "httpx>=0.27",
]
dev = [
  "pytest>=8.3",
  "ruff>=0.9",
]

[project.scripts]
ahe = "ahe_runner.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ahe_runner"]

[tool.hatch.build]
include = [
  "src/ahe_runner/**/*.py",
  "src/ahe_runner/**/*.md",
  "src/ahe_runner/**/*.yaml",
]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
