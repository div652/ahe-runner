[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "ahe-runner"
version = "0.4.1"
description = "Checkpointed Agentic Harness Engineering for NexAU harnesses"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
  "nexau @ git+https://github.com/nex-agi/NexAU.git@v0.3.9",
  # NexAU 0.3.9 imports ThinkingTextMessageContentEvent, removed in 1.0.
  "ag-ui-protocol>=0.1.10,<1.0",
  "greenlet>=3.1.1",
  "openai>=1.60",
  "pydantic>=2.8",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
web = [
  "beautifulsoup4>=4.12",
  "ddgs>=9.0",
  "httpx>=0.27",
]
dev = [
  "pytest>=8.3",
  "ruff>=0.9",
]

[project.scripts]
ahe = "ahe_runner.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ahe_runner"]

[tool.hatch.build]
include = [
  "src/ahe_runner/**/*.py",
  "src/ahe_runner/**/*.md",
  "src/ahe_runner/**/*.yaml",
  "src/ahe_runner/meta/skills/**/*",
]

[tool.hatch.metadata]
allow-direct-references = true

[tool.ruff]
line-length = 88
target-version = "py311"
# Copied unchanged from the original AHE (MIT); keep it byte-identical.
extend-exclude = ["src/ahe_runner/meta/skills/nexau-evolution-guide"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
